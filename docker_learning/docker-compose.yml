version: '3.8'

services:
  # Service 1: An isolated PostgreSQL Database Sandbox instance
  database_sandbox:
    image: postgres:15
    container_name: local_postgres_sandbox
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"

  # Service 2: A web cache layer sitting in front of our systems
  cache_layer:
    image: redis:alpine
    container_name: local_redis_cache
    ports:
      - "6379:6379"